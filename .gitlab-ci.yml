include:
  - project: Infrastructure/freedesktop-ci-templates
    file: templates/alpine.yml
    ref: 6a40df92957c8ce9ee741aaccc5daaaf70545b1e

stages:
  - image-build
  - check

variables:
  FDO_UPSTREAM_REPO: GNOME/gobject-introspection-tests

.gitests.alpine:
  variables:
    FDO_DISTRIBUTION_TAG: '2024-09-11.0'

build-alpine-image:
  extends:
    - .fdo.container-build@alpine
    - .gitests.alpine
  stage: image-build
  variables:
    FDO_DISTRIBUTION_PACKAGES: reuse

license-check:
  extends:
    - .fdo.distribution-image@alpine
    - .gitests.alpine
  stage: check
  dependencies: []  # don't check artifacts from container build
  script:
    - reuse --version
    - reuse lint

gobject-linter:
  stage: check
  allow_failure: true
  image:
    name: "ghcr.io/bilelmoussaoui/gobject-linter:latest"
    entrypoint: [""]
  script:
    - gobject-linter --format gitlab-codequality > gobject-linter-codequality.json
  artifacts:
    expire_in: "1 week"
    reports:
      codequality: gobject-linter-codequality.json
